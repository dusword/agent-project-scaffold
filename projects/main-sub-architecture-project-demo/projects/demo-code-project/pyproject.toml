[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unit-converter"
version = "0.2.0"
description = "最小但完整的单位换算器 —— 代码项目范式的样板"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
convert = "unit_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 不装包也能跑测试：直接把 src/ 加进导入路径
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
